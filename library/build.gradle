plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

apply from: "${rootDir.path}/gradle/publish.gradle"

android {
    namespace = "com.absinthe.lc.rulesbundle"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }


    // Test real producer output without embedding a second copy in the library.
    if (project.hasProperty('rulesTestBundleDir')) {
        sourceSets.androidTest.assets.srcDir(project.property('rulesTestBundleDir'))
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.10.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
