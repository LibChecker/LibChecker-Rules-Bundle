plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

apply from: "${rootDir.path}/gradle/publish.gradle"

android {
    namespace = "com.absinthe.lc.rulesbundle"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        // Keep vectors as XML instead of generating density-specific PNG fallbacks.
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }


    // Test real producer output without embedding a second copy in the library.
    if (project.hasProperty('rulesTestBundleDir')) {
        sourceSets.androidTest.assets.srcDir(project.property('rulesTestBundleDir'))
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.10.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

tasks.register('verifyVectorOnlyAar') {
    dependsOn 'bundleReleaseAar'
    doLast {
        new java.util.zip.ZipFile(layout.buildDirectory.file('outputs/aar/library-release.aar').get().asFile).withCloseable { aar ->
            def bitmaps = aar.entries().findAll {
                !it.directory && it.name.startsWith('res/drawable') && !it.name.endsWith('.xml')
            }*.name
            assert bitmaps.empty: "Non-vector drawables in AAR (${bitmaps.size()}): ${bitmaps.take(5)}"
        }
    }
}

tasks.withType(org.gradle.api.publish.maven.tasks.PublishToMavenLocal).configureEach {
    dependsOn 'verifyVectorOnlyAar'
}
